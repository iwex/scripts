[global]
checkNewVersion = true
sendAnonymousUsage = false

[entryPoints]
  [entryPoints.web]
  address = ":80"

  # HTTPS (websecure on :443) is added below by install.sh, see there

  # API and dashboard, no auth: restrict port 8080 with a firewall
  [entryPoints.traefik]
  address = ":8080"

# Traefik's own log goes to stdout -> journald:  journalctl -u traefik -f
[log]
format = "common"

[accessLog]
filePath = "/var/log/traefik/access.log"
format = "common"

[api]
insecure = true
dashboard = true

[ping]

[providers.docker]
exposedByDefault = false

[providers.file]
directory = "/etc/traefik/dynamic"
watch = true
